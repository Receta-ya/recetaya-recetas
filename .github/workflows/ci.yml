name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Pruebas, JAR e imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: recetaya_ci
          MYSQL_USER: recetaya_ci
          MYSQL_PASSWORD: recetaya-ci
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas con MySQL
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/recetaya_ci
          SPRING_DATASOURCE_USERNAME: recetaya_ci
          SPRING_DATASOURCE_PASSWORD: recetaya-ci
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Construir imagen Docker
        run: docker build --tag "recetaya-recetas:${GITHUB_SHA}" .

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: recetaya-recetas-jar
          path: target/*.jar
          if-no-files-found: error
